name = "lead-router"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "garcar-db"
database_id = "REPLACE_WITH_DB_ID"

[[kv_namespaces]]
binding = "LEADS_KV"
id = "REPLACE_WITH_LEADS_KV_ID"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "REPLACE_WITH_CONFIG_KV_ID"

[vars]
ENVIRONMENT = "production"
