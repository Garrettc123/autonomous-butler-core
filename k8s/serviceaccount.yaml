apiVersion: v1
kind: ServiceAccount
metadata:
  name: butler-core
  namespace: autonomous-butler
  labels:
    app: butler-core
    managed-by: vault-agent-injector
---
# Allow Vault to perform TokenReview for Kubernetes auth
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-tokenreview-butler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: butler-core
    namespace: autonomous-butler
