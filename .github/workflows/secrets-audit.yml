name: Secrets metadata audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: secrets-metadata-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit committed secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow scope
        shell: bash
        run: |
          set -euo pipefail
          echo "Audit scope: committed repository content only."
          echo "No GitHub, Supabase, Plaid, Notion, Linear, cloud, or application secrets are read."

      - name: Scan tracked files for common credential patterns
        shell: bash
        run: |
          set -euo pipefail

          findings_file="$(mktemp)"
          trap 'rm -f "$findings_file"' EXIT

          git grep -nEI \
            -- ':!*.lock' \
            ':!**/node_modules/**' \
            ':!**/vendor/**' \
            ':!**/dist/**' \
            ':!**/build/**' \
            '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(live|test)_[A-Za-z0-9]+|rk_(live|test)_[A-Za-z0-9]+|xox[baprs]-[A-Za-z0-9-]{10,}|sq0atp-[A-Za-z0-9_-]{20,}|sbp?_[A-Za-z0-9_-]{20,}|plaid_(sandbox|development|production)_[A-Za-z0-9_-]{12,})' \
            > "$findings_file" || true

          if [[ -s "$findings_file" ]]; then
            echo "::error::Potential credential-like content detected in tracked files."
            echo "Matches are intentionally not printed to avoid exposing sensitive material."
            exit 1
          fi

          echo "No common credential-like patterns were detected in tracked files."

      - name: Confirm ignored local secret files
        shell: bash
        run: |
          set -euo pipefail

          required_ignores=(
            ".env"
            ".env.*"
            "*.pem"
            "*.key"
            "service-account*.json"
          )

          missing=0
          for pattern in "${required_ignores[@]}"; do
            if ! git check-ignore -q "$pattern"; then
              echo "::warning::Expected ignore rule is not active: $pattern"
              missing=1
            fi
          done

          if [[ "$missing" -eq 1 ]]; then
            echo "::notice::Review .gitignore so local secret material cannot be committed."
          fi

      - name: Publish safe audit summary
        shell: bash
        run: |
          {
            echo "## Secrets metadata audit"
            echo ""
            echo "- Result: passed"
            echo "- Scope: committed repository content only"
            echo "- Secret values read: none"
            echo "- External systems contacted: none"
            echo "- Plaid data or credentials accessed: none"
            echo ""
            echo "Any possible credential-like content fails the workflow without printing the match."
          } >> "$GITHUB_STEP_SUMMARY"
