name: Auto Approve & Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Autonomous Butler Core - CI/CD", "Zero-Touch Deployment Pipeline"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve-merge:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0])
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(python - <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          if "pull_request" in event:
              print(event["pull_request"]["number"])
          else:
              pull_requests = event.get("workflow_run", {}).get("pull_requests", [])
              print(pull_requests[0]["number"] if pull_requests else "")
          PY
          )"

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request associated with this event; skipping."
            exit 0
          fi

          REVIEW_DECISION="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision // ""')"
          MERGE_STATE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq '.mergeStateStatus // ""')"
          AUTO_MERGE_ENABLED="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"

          if [ "$AUTO_MERGE_ENABLED" = "true" ]; then
            echo "Auto-merge is already enabled for PR #$PR_NUMBER."
            exit 0
          fi

          if [ "$REVIEW_DECISION" = "REVIEW_REQUIRED" ] || [ "$REVIEW_DECISION" = "CHANGES_REQUESTED" ]; then
            echo "PR #$PR_NUMBER is not approved yet (decision: $REVIEW_DECISION); skipping for now."
            exit 0
          fi

          if [ "$MERGE_STATE" != "CLEAN" ]; then
            echo "PR #$PR_NUMBER is not mergeable yet (state: $MERGE_STATE); skipping for now."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
