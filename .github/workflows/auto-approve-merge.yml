name: Auto Approve & Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve-merge:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.conclusion == 'success' &&
       github.event.check_suite.pull_requests[0])
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(python - <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          if "pull_request" in event:
              print(event["pull_request"]["number"])
          elif "check_suite" in event:
              pull_requests = event["check_suite"].get("pull_requests", [])
              print(pull_requests[0]["number"] if pull_requests else "")
          else:
              print("")
          PY
          )"

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request associated with this event; skipping."
            exit 0
          fi

          mapfile -t PR_STATE < <(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json reviewDecision,mergeStateStatus,autoMergeRequest \
              --jq '[.reviewDecision // "", .mergeStateStatus // "", (.autoMergeRequest != null)] | .[]'
          )

          REVIEW_DECISION="${PR_STATE[0]}"
          MERGE_STATE="${PR_STATE[1]}"
          AUTO_MERGE_ENABLED="${PR_STATE[2]}"

          if [ "$AUTO_MERGE_ENABLED" = "true" ]; then
            echo "Auto-merge is already enabled for PR #$PR_NUMBER."
            exit 0
          fi

          case "$REVIEW_DECISION" in
            APPROVED)
              ;;
            "")
              echo "PR #$PR_NUMBER has no approval decision yet; skipping for now."
              exit 0
              ;;
            REVIEW_REQUIRED|CHANGES_REQUESTED)
              echo "PR #$PR_NUMBER is not approved yet (decision: $REVIEW_DECISION); skipping for now."
              exit 0
              ;;
            *)
              echo "PR #$PR_NUMBER has unexpected review decision '$REVIEW_DECISION'; skipping for now."
              exit 0
              ;;
          esac

          case "$MERGE_STATE" in
            CLEAN)
              ;;
            BEHIND|BLOCKED|DIRTY|DRAFT|HAS_HOOKS|UNKNOWN|UNSTABLE)
              echo "PR #$PR_NUMBER is not mergeable yet (state: $MERGE_STATE); skipping for now."
              exit 0
              ;;
            *)
              echo "PR #$PR_NUMBER has unexpected merge state '$MERGE_STATE'; skipping for now."
              exit 0
              ;;
          esac

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
