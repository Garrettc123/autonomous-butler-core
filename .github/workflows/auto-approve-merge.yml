name: Auto Approve & Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve-merge:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.conclusion == 'success' &&
       toJson(github.event.check_suite.pull_requests) != '[]')
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(jq -r '
            if .pull_request then
              .pull_request.number
            elif (.check_suite.pull_requests? // [] | length) > 0 then
              # Use the first associated PR returned for this check suite.
              .check_suite.pull_requests[0].number
            else
              ""
            end
          ' "$GITHUB_EVENT_PATH")"

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request associated with this event; skipping."
            exit 0
          fi

          GH_VIEW_ERROR="$(mktemp)"

          if ! PR_JSON="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json reviewDecision,mergeStateStatus,autoMergeRequest \
            2>"$GH_VIEW_ERROR")"; then
            echo "Failed to read PR #$PR_NUMBER state from GitHub; skipping."
            cat "$GH_VIEW_ERROR"
            rm -f "$GH_VIEW_ERROR"
            exit 0
          fi

          rm -f "$GH_VIEW_ERROR"

          REVIEW_DECISION="$(jq -r '.reviewDecision // ""' <<<"$PR_JSON")"
          MERGE_STATE="$(jq -r '.mergeStateStatus // ""' <<<"$PR_JSON")"
          AUTO_MERGE_ENABLED="$(jq -r '.autoMergeRequest != null' <<<"$PR_JSON")"

          if [ "$AUTO_MERGE_ENABLED" = "true" ]; then
            echo "Auto-merge is already enabled for PR #$PR_NUMBER."
            exit 0
          fi

          case "$REVIEW_DECISION" in
            APPROVED)
              ;;
            "")
              echo "PR #$PR_NUMBER has no approval decision yet; skipping for now."
              exit 0
              ;;
            REVIEW_REQUIRED)
              echo "PR #$PR_NUMBER still requires an approving review; skipping for now."
              exit 0
              ;;
            CHANGES_REQUESTED)
              echo "PR #$PR_NUMBER has requested changes; skipping for now."
              exit 0
              ;;
            *)
              echo "PR #$PR_NUMBER has unexpected review decision '$REVIEW_DECISION'; skipping for now."
              exit 0
              ;;
          esac

          case "$MERGE_STATE" in
            CLEAN)
              ;;
            BLOCKED)
              echo "PR #$PR_NUMBER is still blocked by branch protection or required checks; skipping for now."
              exit 0
              ;;
            DIRTY)
              echo "PR #$PR_NUMBER has merge conflicts; skipping for now."
              exit 0
              ;;
            HAS_HOOKS)
              echo "PR #$PR_NUMBER is waiting on required hooks; skipping for now."
              exit 0
              ;;
            UNKNOWN)
              echo "PR #$PR_NUMBER mergeability is still unknown; skipping for now."
              exit 0
              ;;
            UNSTABLE)
              echo "PR #$PR_NUMBER checks are still unstable; skipping for now."
              exit 0
              ;;
            *)
              echo "PR #$PR_NUMBER has unexpected merge state '$MERGE_STATE'; skipping for now."
              exit 0
              ;;
          esac

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
