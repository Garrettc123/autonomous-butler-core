name: Secrets Validation (Vault)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull secrets from Vault
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/ai * ;
            secret/data/garcar/github * ;
            secret/data/garcar/slack * ;
            secret/data/garcar/base * ;
            secret/data/garcar/shopify * ;
            secret/data/garcar/notion * ;
            secret/data/garcar/linear * ;
            secret/data/garcar/supabase * ;
            secret/data/garcar/wix * ;
            secret/data/garcar/hubspot * ;
            secret/data/garcar/apollo * ;
            secret/data/garcar/docusign * ;
            secret/data/garcar/google * ;
            secret/data/garcar/clickup * ;
            secret/data/garcar/asana * ;
            secret/data/garcar/stripe * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/infra * ;

      - name: Platform reachability smoke tests
        run: |
          set -euo pipefail

          echo "=== GitHub ==="
          curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/user | jq -r '.login'

          echo "=== Slack ==="
          curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" https://slack.com/api/auth.test | jq -r '.ok'

          echo "=== Notion ==="
          curl -s -H "Authorization: Bearer $NOTION_API_KEY" -H "Notion-Version: 2022-06-28" https://api.notion.com/v1/users/me | jq -r '.object'

          echo "=== Linear ==="
          curl -s -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
            -d '{"query":"{ viewer { id name } }"}' https://api.linear.app/graphql | jq -r '.data.viewer.name'

          echo "=== Supabase ==="
          curl -s -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/" | head -c 100

          echo "=== HubSpot ==="
          curl -s -H "Authorization: Bearer $HUBSPOT_PRIVATE_APP_TOKEN" https://api.hubapi.com/integrations/v1/me | jq -r '.portalId'

          echo "=== All platform smoke tests passed ==="
