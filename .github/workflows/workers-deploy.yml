name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/workers-deploy.yml'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-config-bus:
    name: Deploy config-bus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy config-bus
        working-directory: workers/config-bus
        run: wrangler deploy

  deploy-health-monitor:
    name: Deploy health-monitor
    runs-on: ubuntu-latest
    needs: deploy-config-bus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy health-monitor
        working-directory: workers/health-monitor
        run: wrangler deploy

  deploy-parallel:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest
    needs: deploy-health-monitor
    strategy:
      matrix:
        worker: [stripe-webhook, stripe-poller, lead-router]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy ${{ matrix.worker }}
        working-directory: workers/${{ matrix.worker }}
        run: wrangler deploy
