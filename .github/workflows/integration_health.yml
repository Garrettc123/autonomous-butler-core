name: Integration Health Check — 14 Platforms (Vault-native)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'integrations/**'
      - 'vault/**'
      - '.github/workflows/integration_health.yml'

permissions:
  id-token: write
  contents: read

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

jobs:
  health_check:
    runs-on: ubuntu-latest
    name: Check All 14 Platform Integrations via Vault

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require VAULT_ADDR
        run: |
          if [ -z "${{ env.VAULT_ADDR }}" ]; then
            echo "::error::VAULT_ADDR is not set. Add it to repository secrets."
            exit 1
          fi

      - name: Import ALL secrets from Vault
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/ai * ;
            secret/data/garcar/github * ;
            secret/data/garcar/slack * ;
            secret/data/garcar/base * ;
            secret/data/garcar/shopify * ;
            secret/data/garcar/notion * ;
            secret/data/garcar/linear * ;
            secret/data/garcar/supabase * ;
            secret/data/garcar/wix * ;
            secret/data/garcar/hubspot * ;
            secret/data/garcar/apollo * ;
            secret/data/garcar/docusign * ;
            secret/data/garcar/google * ;
            secret/data/garcar/clickup * ;
            secret/data/garcar/asana * ;
            secret/data/garcar/stripe * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/infra * ;

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration health checks
        run: python integrations/integration_health_check.py

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ALERTS }}
          slack-message: '🚨 Integration health check FAILED — Vault secrets or platform connectivity issue'
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
