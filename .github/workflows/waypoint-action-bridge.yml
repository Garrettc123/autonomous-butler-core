name: Waypoint Action Bridge

# Allows HCP Waypoint Actions to trigger existing Vault-native workflows
# without duplicating logic. Waypoint calls this workflow_dispatch entrypoint.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        type: choice
        options:
          - deploy
          - validate-secrets
          - health-check
      ref:
        description: 'Git ref to use'
        required: false
        default: main

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger target workflow
        uses: actions/github-script@v7
        with:
          script: |
            const action = '${{ inputs.action }}';
            const ref = '${{ inputs.ref }}' || 'main';
            const map = {
              'deploy': 'ci-cd.yml',
              'validate-secrets': 'secrets-validation.yml',
              'health-check': 'integration_health.yml'
            };
            const workflow = map[action];
            if (!workflow) {
              core.setFailed(`Unknown action: ${action}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow,
              ref: ref
            });
            console.log(`Triggered ${workflow} for action=${action}`);
