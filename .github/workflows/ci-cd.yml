name: Autonomous Butler Core - CI/CD (Vault-native)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

permissions:
  id-token: write   # Required for Vault OIDC JWT
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DEFAULT_ICP_KEYWORDS: devops,platform-engineering,sre,ai-ops,kubernetes
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

jobs:
  # ── Vault secret pull (runs first on every job that needs secrets) ──
  vault-secrets:
    name: "Pull secrets from Vault"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      has_vault: ${{ steps.check.outputs.has_vault }}
    steps:
      - name: Check VAULT_ADDR
        id: check
        run: |
          if [ -z "${{ env.VAULT_ADDR }}" ]; then
            echo "has_vault=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VAULT_ADDR not set — falling back to legacy GitHub secrets (not recommended)"
          else
            echo "has_vault=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import ALL Garcar secrets from Vault
        if: steps.check.outputs.has_vault == 'true'
        id: vault
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/ai * ;
            secret/data/garcar/github * ;
            secret/data/garcar/slack * ;
            secret/data/garcar/base * ;
            secret/data/garcar/shopify * ;
            secret/data/garcar/notion * ;
            secret/data/garcar/linear * ;
            secret/data/garcar/supabase * ;
            secret/data/garcar/wix * ;
            secret/data/garcar/hubspot * ;
            secret/data/garcar/apollo * ;
            secret/data/garcar/docusign * ;
            secret/data/garcar/google * ;
            secret/data/garcar/clickup * ;
            secret/data/garcar/asana * ;
            secret/data/garcar/stripe * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/infra * ;

      - name: Fail if critical secrets missing
        if: steps.check.outputs.has_vault == 'true'
        run: |
          set -e
          required=(
            ANTHROPIC_API_KEY
            GITHUB_TOKEN
            STRIPE_SECRET_KEY
            SLACK_BOT_TOKEN
            LINEAR_API_KEY
          )
          missing=0
          for var in "${required[@]}"; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing critical secret from Vault: $var"
              missing=1
            else
              echo "✅ $var present"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "::error::Critical secrets missing from Vault — aborting"
            exit 1
          fi
          echo "All critical secrets successfully loaded from Vault"

  test:
    name: "Test Agent Orchestration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: pytest

  build:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  resolve-secrets:
    name: "Resolve production secrets (Vault-first)"
    runs-on: ubuntu-latest
    needs: [vault-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      icp: ${{ steps.resolve.outputs.icp }}
      has_acquisition: ${{ steps.resolve.outputs.has_acquisition }}
      has_github_pat: ${{ steps.resolve.outputs.has_github_pat }}
      has_kube: ${{ steps.resolve.outputs.has_kube }}
      has_railway: ${{ steps.resolve.outputs.has_railway }}
      has_vault: ${{ needs.vault-secrets.outputs.has_vault }}
    steps:
      - name: Import from Vault (if available)
        if: needs.vault-secrets.outputs.has_vault == 'true'
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/stripe * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/infra * ;
            secret/data/garcar/github * ;

      - name: Resolve
        id: resolve
        env:
          ICP_FROM_VARS: ${{ vars.ICP_KEYWORDS }}
          # Prefer Vault values; fall back to legacy GitHub secrets only if Vault not configured
          STRIPE_ACQUISITION_PRICE_ID: ${{ env.STRIPE_ACQUISITION_PRICE_ID || secrets.STRIPE_ACQUISITION_PRICE_ID }}
          GH_PAT: ${{ env.GITHUB_TOKEN || secrets.GH_PAT || secrets.GITHUB_PAT }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$ICP_FROM_VARS" ]; then
            echo "icp=$ICP_FROM_VARS" >> "$GITHUB_OUTPUT"
          else
            echo "icp=${{ env.DEFAULT_ICP_KEYWORDS }}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$STRIPE_ACQUISITION_PRICE_ID" ]; then
            echo "has_acquisition=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_acquisition=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STRIPE_ACQUISITION_PRICE_ID not set"
          fi

          if [ -n "$GH_PAT" ]; then
            echo "has_github_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_github_pat=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$KUBE_CONFIG" ]; then
            echo "has_kube=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_kube=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "has_railway=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_railway=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-k8s:
    name: "Deploy Butler Core (Kubernetes)"
    runs-on: ubuntu-latest
    needs: [build, resolve-secrets, vault-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.resolve-secrets.outputs.has_kube == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Import secrets from Vault
        if: needs.vault-secrets.outputs.has_vault == 'true'
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/ai * ;
            secret/data/garcar/github * ;
            secret/data/garcar/slack * ;
            secret/data/garcar/stripe * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/linear * ;

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests + secrets from Vault
        env:
          # Values come from Vault when available, otherwise legacy secrets
          STRIPE_SECRET_KEY: ${{ env.STRIPE_SECRET_KEY || secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ env.STRIPE_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_USAGE_PRICE_ID: ${{ env.STRIPE_USAGE_PRICE_ID || secrets.STRIPE_USAGE_PRICE_ID }}
          STRIPE_ACQUISITION_PRICE_ID: ${{ env.STRIPE_ACQUISITION_PRICE_ID || secrets.STRIPE_ACQUISITION_PRICE_ID }}
          CLEARBIT_API_KEY: ${{ env.CLEARBIT_API_KEY || secrets.CLEARBIT_API_KEY }}
          HUNTER_API_KEY: ${{ env.HUNTER_API_KEY || secrets.HUNTER_API_KEY }}
          ICP_KEYWORDS: ${{ needs.resolve-secrets.outputs.icp }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          LINEAR_API_KEY: ${{ env.LINEAR_API_KEY || secrets.LINEAR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          LEAD_GITHUB_TOKEN: ${{ env.GITHUB_TOKEN || secrets.GH_PAT || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          kubectl apply -f k8s/namespace.yaml

          kubectl create secret generic butler-secrets \
            --namespace autonomous-butler \
            --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY" \
            --from-literal=openai-api-key="$OPENAI_API_KEY" \
            --from-literal=github-token="$LEAD_GITHUB_TOKEN" \
            --from-literal=linear-api-key="$LINEAR_API_KEY" \
            --from-literal=stripe-secret-key="$STRIPE_SECRET_KEY" \
            --from-literal=stripe-webhook-secret="$STRIPE_WEBHOOK_SECRET" \
            --from-literal=stripe-usage-price-id="$STRIPE_USAGE_PRICE_ID" \
            --from-literal=stripe-acquisition-price-id="$STRIPE_ACQUISITION_PRICE_ID" \
            --from-literal=clearbit-api-key="$CLEARBIT_API_KEY" \
            --from-literal=hunter-api-key="$HUNTER_API_KEY" \
            --from-literal=icp-keywords="$ICP_KEYWORDS" \
            --from-literal=slack-webhook-url="$SLACK_WEBHOOK_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Pin image to this commit
        run: |
          kubectl set image deployment/butler-core \
            butler-core="${{ needs.build.outputs.image }}:${{ github.sha }}" \
            --namespace autonomous-butler

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/butler-core \
            --namespace autonomous-butler --timeout=5m

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/butler-core --namespace autonomous-butler

  deploy-railway:
    name: "Deploy Butler Core (Railway)"
    runs-on: ubuntu-latest
    needs: [build, resolve-secrets, vault-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.resolve-secrets.outputs.has_railway == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Import secrets from Vault
        if: needs.vault-secrets.outputs.has_vault == 'true'
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/ai * ;
            secret/data/garcar/stripe * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/linear * ;
            secret/data/garcar/slack * ;
            secret/data/garcar/github * ;

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Sync revenue env vars to Railway (Vault-first)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set_if_present() {
            local key="$1" value="$2"
            if [ -n "$value" ]; then
              railway variables set "$key=$value"
              echo "set $key"
            else
              echo "skip $key (empty)"
            fi
          }

          set_if_present STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-${{ secrets.STRIPE_SECRET_KEY }}}"
          set_if_present STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-${{ secrets.STRIPE_WEBHOOK_SECRET }}}"
          set_if_present STRIPE_USAGE_PRICE_ID "${STRIPE_USAGE_PRICE_ID:-${{ secrets.STRIPE_USAGE_PRICE_ID }}}"
          set_if_present STRIPE_ACQUISITION_PRICE_ID "${STRIPE_ACQUISITION_PRICE_ID:-${{ secrets.STRIPE_ACQUISITION_PRICE_ID }}}"
          set_if_present CLEARBIT_API_KEY "${CLEARBIT_API_KEY:-${{ secrets.CLEARBIT_API_KEY }}}"
          set_if_present HUNTER_API_KEY "${HUNTER_API_KEY:-${{ secrets.HUNTER_API_KEY }}}"
          set_if_present ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-${{ secrets.ANTHROPIC_API_KEY }}}"
          set_if_present OPENAI_API_KEY "${OPENAI_API_KEY:-${{ secrets.OPENAI_API_KEY }}}"
          set_if_present LINEAR_API_KEY "${LINEAR_API_KEY:-${{ secrets.LINEAR_API_KEY }}}"
          set_if_present SLACK_WEBHOOK_URL "${SLACK_WEBHOOK_URL:-${{ secrets.SLACK_WEBHOOK_URL }}}"

          railway variables set "ICP_KEYWORDS=${{ needs.resolve-secrets.outputs.icp }}"
          railway variables set "GITHUB_TOKEN=${GITHUB_TOKEN:-${{ secrets.GH_PAT || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}}"
          railway variables set "REVENUE_STREAMS=all"
          railway variables set "ENVIRONMENT=production"
          echo "Railway revenue env synced (Vault-first)"

  agent-status:
    name: "🤖 Agent Status Monitor"
    runs-on: ubuntu-latest
    needs: [test, resolve-secrets, vault-secrets]
    if: always()
    steps:
      - name: Agent Status
        run: |
          echo "🤖 AUTONOMOUS BUTLER - MULTI-AGENT SYSTEM (Vault-native)"
          echo "========================================"
          echo "Test suite: ${{ needs.test.result }}"
          echo "Vault configured: ${{ needs.vault-secrets.outputs.has_vault }}"
          echo "ICP_KEYWORDS: ${{ needs.resolve-secrets.outputs.icp }}"
          echo "Acquisition price set: ${{ needs.resolve-secrets.outputs.has_acquisition }}"
          echo "GitHub PAT set: ${{ needs.resolve-secrets.outputs.has_github_pat }}"
          echo "K8s deploy ready: ${{ needs.resolve-secrets.outputs.has_kube }}"
          echo "Railway deploy ready: ${{ needs.resolve-secrets.outputs.has_railway }}"
          echo "Agents: devops, revenue, security, pm, support, infrastructure"
          echo "Revenue streams: acquisition, subscriptions, usage_based, one_time, dunning, expansion"
          echo "========================================"
