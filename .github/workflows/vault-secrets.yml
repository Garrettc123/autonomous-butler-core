name: Vault Secrets Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vault-secrets.yml'
      - 'vault/**'

permissions:
  id-token: write   # Required for GitHub OIDC → Vault JWT
  contents: read

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  # Optional for HCP / Enterprise
  # VAULT_NAMESPACE: ${{ secrets.VAULT_NAMESPACE }}

jobs:
  pull-all-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import ALL Garcar secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          # path: jwt   # default
          secrets: |
            secret/data/garcar/ai * ;
            secret/data/garcar/github * ;
            secret/data/garcar/slack * ;
            secret/data/garcar/base * ;
            secret/data/garcar/shopify * ;
            secret/data/garcar/notion * ;
            secret/data/garcar/linear * ;
            secret/data/garcar/supabase * ;
            secret/data/garcar/wix * ;
            secret/data/garcar/hubspot * ;
            secret/data/garcar/apollo * ;
            secret/data/garcar/docusign * ;
            secret/data/garcar/google * ;
            secret/data/garcar/clickup * ;
            secret/data/garcar/asana * ;
            secret/data/garcar/stripe * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/infra * ;

      - name: Verify critical secrets are present
        run: |
          set -e
          required=(
            ANTHROPIC_API_KEY
            GITHUB_TOKEN
            SLACK_BOT_TOKEN
            COINBASE_CDP_API_KEY
            SHOPIFY_ADMIN_API_KEY
            NOTION_API_KEY
            LINEAR_API_KEY
            SUPABASE_URL
            HUBSPOT_PRIVATE_APP_TOKEN
            APOLLO_API_KEY
            STRIPE_SECRET_KEY
          )
          for var in "${required[@]}"; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required secret: $var"
              exit 1
            fi
            echo "✅ $var is present"
          done
          echo "All critical secrets successfully pulled from Vault"
